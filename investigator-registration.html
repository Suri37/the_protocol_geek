<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Investigator Registration</title><link rel='stylesheet' href='css/styles.css'></head><body><main class='container contact-card form-page'><h1>Investigator Registration</h1><p>Share your site or investigator details for future clinical research collaboration.</p><form data-supabase-table='investigator_registrations' class='tpg-form'><div class='form-grid'><input name='investigator_name' placeholder='Investigator Name' required><input name='designation' placeholder='Designation / Role'><input name='hospital_site' placeholder='Hospital / Site' required><input name='department' placeholder='Department'><select name='site_type'><option value=''>Site Type</option><option>Hospital</option><option>Clinic</option><option>Diagnostic Center</option><option>Academic Institute</option><option>Other</option></select><input name='email' type='email' placeholder='Email' required><input name='phone' placeholder='Phone'><input name='city' placeholder='City'><input name='state' placeholder='State'><input name='country' placeholder='Country' value='India'><input name='therapeutic_area' placeholder='Therapeutic Area'><input name='patient_population' placeholder='Approx. patient population / month'><select name='trial_experience'><option value=''>Clinical Trial Experience</option><option>No prior experience</option><option>1-3 studies</option><option>4-10 studies</option><option>10+ studies</option></select><select name='ethics_committee_access'><option value=''>Ethics Committee Access</option><option>Yes - Institutional EC</option><option>Yes - Independent EC</option><option>No</option><option>Not sure</option></select><select name='coordinator_available'><option value=''>Coordinator Available?</option><option>Yes</option><option>No</option><option>Can arrange</option></select><select name='pharmacy_lab_access'><option value=''>Pharmacy/Lab Access</option><option>Both available</option><option>Pharmacy only</option><option>Lab only</option><option>Not available</option></select><select name='partnership_interest'><option value=''>Partnership Interest</option><option>Site readiness</option><option>SMO collaboration</option><option>Future trials</option><option>Investigator network</option></select></div><textarea name='equipment_capabilities' placeholder='Equipment/capabilities available at site'></textarea><textarea name='site_details' placeholder='Tell us about your site'></textarea><label class='consent-line'><input name='consent' type='checkbox' required> I consent to The Protocol Geek contacting me about clinical research partnership opportunities.</label><button type='submit' class='button'>Submit</button><p data-form-status></p></form></main><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='js/supabase-config.js'></script><script src='js/forms.js'></script></body></html>
