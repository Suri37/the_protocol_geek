<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Study Participation</title><link rel='stylesheet' href='css/styles.css'></head><body><main class='container contact-card form-page'><h1>Study Participation Registration</h1><p>Share your interest in future clinical research opportunities. Please do not include detailed medical records in this form.</p><form data-supabase-table='study_participants' class='tpg-form'><div class='form-grid'><input name='full_name' placeholder='Full Name' required><input name='email' type='email' placeholder='Email' required><input name='phone' placeholder='Phone'><input name='city' placeholder='City'><input name='state' placeholder='State'><input name='country' placeholder='Country' value='India'><select name='age_range'><option value=''>Age Range</option><option>18-30</option><option>31-45</option><option>46-60</option><option>61+</option></select><select name='gender'><option value=''>Gender</option><option>Female</option><option>Male</option><option>Prefer not to say</option><option>Other</option></select><select name='preferred_contact_method'><option value=''>Preferred Contact Method</option><option>Phone</option><option>Email</option><option>WhatsApp</option></select><input name='therapeutic_interests' placeholder='Therapeutic Interests, e.g. diabetes, orthopedics'><select name='previous_trial_experience'><option value=''>Previous Clinical Trial Experience?</option><option>No</option><option>Yes</option><option>Not sure</option></select><input name='referral_source' placeholder='How did you hear about us?'></div><textarea name='availability_notes' placeholder='Availability or location preferences'></textarea><textarea name='interest_reason' placeholder='Why are you interested?'></textarea><textarea name='notes' placeholder='Additional notes'></textarea><label class='consent-line'><input name='consent' type='checkbox' required> I consent to The Protocol Geek contacting me about relevant clinical research opportunities.</label><button type='submit' class='button'>Submit</button><p data-form-status></p></form></main><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='js/supabase-config.js'></script><script src='js/forms.js'></script></body></html>
